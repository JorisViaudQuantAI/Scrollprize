name: Adaptive 067 Claude carrier ray atlas
on:
  push:
    branches: [chatgpt/adaptive-surface-recovery]
    paths:
      - .github/workflows/chatgpt-adaptive-claude-carrier-atlas.yml
permissions:
  contents: read
jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin CPU dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.12.0 tifffile==2024.9.20 requests==2.32.5
      - name: Retrieve exact Claude 026 geometry
        run: |
          git init /tmp/claude-067
          git -C /tmp/claude-067 remote add origin https://github.com/JorisViaudQuantAI/Scrollprize.git
          git -C /tmp/claude-067 config remote.origin.promisor true
          git -C /tmp/claude-067 config remote.origin.partialclonefilter blob:none
          git -C /tmp/claude-067 fetch --no-tags --depth=1 --filter=blob:none origin ab5b297de8cf696e098852ccb9b3be766317acb2
          git -C /tmp/claude-067 sparse-checkout set firstletters-colab/pherc0211_fit_windings
          git -C /tmp/claude-067 checkout --detach FETCH_HEAD
      - name: Execute frozen reciprocal ray atlas
        run: python firstletters-colab/adaptive_surface_recovery/claude_carrier_atlas/run.py --claude /tmp/claude-067 --output /tmp/atlas-067.json --maps /tmp/atlas-067.npz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-067-public-carrier-atlas
          path: |
            /tmp/atlas-067.json
            /tmp/atlas-067.npz
          retention-days: 30
