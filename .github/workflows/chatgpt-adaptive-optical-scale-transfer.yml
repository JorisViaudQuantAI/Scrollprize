name: Adaptive 051 optical scale transfer
on:
  push:
    branches: [chatgpt/adaptive-surface-recovery]
    paths:
      - .github/workflows/chatgpt-adaptive-optical-scale-transfer.yml
permissions:
  contents: read
jobs:
  stretch:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy==1.26.4 scipy==1.12.0 Pillow==11.3.0 numcodecs==0.15.1 requests==2.32.5
      - name: Install existing A-hn CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check safetensors==0.5.3 huggingface_hub==0.30.2
      - name: Execute paired optical fragment scale transfer
        run: python firstletters-colab/adaptive_surface_recovery/optical_scale_transfer/run.py --prior firstletters-colab/adaptive_surface_recovery/detector_bridge/result.json --cache /tmp/optical-051-input --output /tmp/optical-051.json
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-051-optical-scale-receipt
          path: /tmp/optical-051.json
          retention-days: 30
