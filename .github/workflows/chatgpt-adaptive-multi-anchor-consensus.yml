name: Adaptive 061 multi-anchor path consensus
on:
  push:
    branches: [chatgpt/adaptive-surface-recovery]
    paths:
      - .github/workflows/chatgpt-adaptive-multi-anchor-consensus.yml
permissions:
  contents: read
jobs:
  hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin solver and reader dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.12.0 dtw-python==1.5.3 scikit-learn==1.5.2 scikit-image==0.24.0 bioimage-cpp==0.8.0 pynrrd==1.1.3 tifffile==2024.9.20 Pillow==11.3.0 requests==2.32.5
      - name: Run frozen multi-anchor consensus comparison
        run: python firstletters-colab/adaptive_surface_recovery/multi_anchor_consensus/run.py --cache /tmp/consensus-061 --output /tmp/consensus-061.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-061-multi-anchor-consensus-receipt
          path: /tmp/consensus-061.json
          retention-days: 30
