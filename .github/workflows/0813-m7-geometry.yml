name: Check the public PHerc 0813 winding against native CT
on:
  push:
    branches: [codex/0813-m7-geometry]
    paths:
      - '.github/workflows/0813-m7-geometry.yml'
      - 'registration-checks/atlas-0813/check.py'
      - 'registration-checks/atlas-0813/protocol.txt'
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      BLOSC_NTHREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --only-binary=:all: numpy==2.1.3 scipy==1.15.3 requests==2.32.5 tifffile==2025.5.10 zarr==2.18.7 numcodecs==0.15.1
      - name: Snap the atlas winding and compare disjoint native CT profiles
        run: python -u registration-checks/atlas-0813/check.py
      - uses: actions/upload-artifact@v4
        with:
          name: PHerc0813-geometry-summary
          path: |
            registration-checks/atlas-0813/result.json
            registration-checks/atlas-0813/public-catalog.json
          retention-days: 14
