name: Public mesh registration check
on:
  push:
    branches: [codex/public-mesh-transfer]
    paths: ['registration-checks/annular/mesh-transfer/check.py', '.github/workflows/public-mesh-transfer.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy requests tifffile imagecodecs
      - name: Test official mesh vertices
        run: OPENBLAS_NUM_THREADS=1 python registration-checks/annular/mesh-transfer/check.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-mesh-geometry
          path: mesh-transfer-result.json
          retention-days: 7
