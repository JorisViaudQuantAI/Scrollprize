name: B18 native Reader v3 CPU benchmark
on:
  push:
    branches: [chatgpt/b18-paired-reader]
    paths:
      - '.github/workflows/chatgpt-b18-reader-cpu.yml'
permissions:
  contents: read
jobs:
  reader-public-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
          python -m pip install numpy==2.3.5 scipy==1.15.3 zarr==3.1.3 numcodecs==0.16.3 tifffile==2025.6.11 pillow pynrrd requests pyyaml fsspec s3fs cachetools edt aiohttp nest-asyncio timm==1.0.20 einops huggingface_hub dynamic-network-architectures fvcore batchgenerators scikit-image tqdm psutil
      - name: Fetch the pinned upstream source and public W00 fixture
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/villa"
          git -C "$RUNNER_TEMP/villa" remote add origin https://github.com/ScrollPrize/villa.git
          git -C "$RUNNER_TEMP/villa" fetch --depth=1 origin b29f310957c7b29e7d332f9876e0e487819cfaa3
          git -C "$RUNNER_TEMP/villa" checkout --detach FETCH_HEAD
          python evidence/fetch_fixture.py w00 "$RUNNER_TEMP/w00.zarr" --cache "$RUNNER_TEMP/fixture-cache" --checkpoint "$RUNNER_TEMP/reader-v3.pth"
      - name: Run paired preprocessing and real network benchmark
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/villa/vesuvius/src:$PWD/firstletters-colab/reader_cpu_optimization"
          python firstletters-colab/reader_cpu_optimization/b18_paired/reader_runner.py "$RUNNER_TEMP/w00.zarr" "$RUNNER_TEMP/reader-v3.pth" "$RUNNER_TEMP/b18-reader.json"
      - uses: actions/upload-artifact@v4
        with:
          name: b18-reader-public-benchmark
          path: ${{ runner.temp }}/b18-reader.json
          retention-days: 14
