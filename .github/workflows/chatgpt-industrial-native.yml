name: Native evidence and public numerical checks

on:
  push:
    branches: [chatgpt/industrial-native-evidence]
    paths:
      - .github/workflows/chatgpt-industrial-native.yml
      - firstletters-colab/industrial_funnel/**
      - firstletters-colab/visual_discovery_20261124/**
  pull_request:
    paths:
      - .github/workflows/chatgpt-industrial-native.yml
      - firstletters-colab/industrial_funnel/**
      - firstletters-colab/visual_discovery_20261124/**

permissions:
  contents: read

jobs:
  native-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the measured numerical dependency
        run: python -m pip install numpy==2.3.5
      - name: Verify synthetic reference and native-array contracts
        run: python firstletters-colab/industrial_funnel/verify_native.py --output /tmp/native-tests.json
      - name: Recalculate the published numerical evidence
        run: python firstletters-colab/visual_discovery_20261124/verify_evidence.py > /tmp/visual-evidence-check.json
      - name: Recalculate the geometry correspondence evidence
        run: python firstletters-colab/industrial_funnel/geometry_dedup_followup/verify.py > /tmp/geometry-evidence-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-public-evidence-checks
          path: |
            /tmp/native-tests.json
            /tmp/visual-evidence-check.json
            /tmp/geometry-evidence-check.json
          retention-days: 30
