name: Prepare whole published DLS depth layers
on:
  push:
    branches: [codex/dls-public-depth-fixture]
    paths: [.github/workflows/dls-public-depth.yml]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        layer: [29, 30, 31, 33, 34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 tifffile==2025.5.10
      - run: python public-controls/dls-depth/stage.py ${{ matrix.layer }} public-controls/dls-depth/recipient.pem
      - uses: actions/upload-artifact@v4
        if: hashFiles('piece-0/data.bin') != ''
        with:
          name: dls-layer-${{ matrix.layer }}-part-0
          path: piece-0/
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: hashFiles('piece-1/data.bin') != ''
        with:
          name: dls-layer-${{ matrix.layer }}-part-1
          path: piece-1/
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: hashFiles('piece-2/data.bin') != ''
        with:
          name: dls-layer-${{ matrix.layer }}-part-2
          path: piece-2/
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: hashFiles('piece-3/data.bin') != ''
        with:
          name: dls-layer-${{ matrix.layer }}-part-3
          path: piece-3/
          compression-level: 0
          retention-days: 1
