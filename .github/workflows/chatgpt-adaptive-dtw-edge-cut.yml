name: Adaptive 062 path-free DTW edge cut
on:
  push:
    branches: [chatgpt/adaptive-surface-recovery]
    paths:
      - .github/workflows/chatgpt-adaptive-dtw-edge-cut.yml
permissions:
  contents: read
jobs:
  hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin solver and reader dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.12.0 dtw-python==1.5.3 scikit-learn==1.5.2 scikit-image==0.24.0 bioimage-cpp==0.8.0 pynrrd==1.1.3 tifffile==2024.9.20 Pillow==11.3.0 requests==2.32.5
      - name: Run frozen path-free DTW cut comparison
        run: python firstletters-colab/adaptive_surface_recovery/dtw_edge_cut/run.py --cache /tmp/edge-cut-062 --output /tmp/edge-cut-062.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-062-edge-cut-receipt
          path: /tmp/edge-cut-062.json
          retention-days: 30
