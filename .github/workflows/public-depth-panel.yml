name: Public PHerc. 841 depth-order panel
on:
  push:
    branches: [codex/r50-public-control]
    paths:
      - public-controls/depth_panel.py
      - .github/workflows/public-depth-panel.yml
permissions: {}
jobs:
  one-cpu-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Read the public control code at the triggering commit
        run: |
          git init study
          git -C study fetch --depth=1 https://github.com/JorisViaudQuantAI/Scrollprize.git "$GITHUB_SHA"
          git -C study checkout --detach FETCH_HEAD
          test "$(git -C study rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install the CPU environment
        run: |
          python3 -m venv "$RUNNER_TEMP/panel-env"
          "$RUNNER_TEMP/panel-env/bin/python" -m pip install -q --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          "$RUNNER_TEMP/panel-env/bin/python" -m pip install -q --disable-pip-version-check 'transformers==4.57.6' 'safetensors==0.6.2' 'numpy==2.2.6' 'scipy==1.15.3' 'zarr==3.1.3' 'fsspec==2025.9.0' 'aiohttp>=3.10,<4' 'requests>=2.32,<3'
      - name: Freeze public validation tiles and run all three orders
        working-directory: study
        run: |
          "$RUNNER_TEMP/panel-env/bin/python" public-controls/depth_panel.py --cache "$RUNNER_TEMP/r50-weights" --output "$RUNNER_TEMP/r50-depth-panel.json"
          sha256sum "$RUNNER_TEMP/r50-depth-panel.json"
