name: Adaptive 054 ordered sheet tracking
on:
  push:
    branches: [chatgpt/adaptive-surface-recovery]
    paths:
      - .github/workflows/chatgpt-adaptive-ordered-tracking.yml
permissions:
  contents: read
jobs:
  tracking:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin solver and inherited source reader dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.12.0 dtw-python==1.5.3 scikit-learn==1.5.2 scikit-image==0.24.0 bioimage-cpp==0.8.0 pynrrd==1.1.3 tifffile==2024.9.20 Pillow==11.3.0 requests==2.32.5
      - name: Run exact solver oracle and real annotated section comparison
        run: python firstletters-colab/adaptive_surface_recovery/ordered_tracking/run.py --prior firstletters-colab/adaptive_surface_recovery/orthogonal_instances/result.json --cache /tmp/ordered-054 --output /tmp/ordered-054.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-054-ordered-tracking-receipt
          path: /tmp/ordered-054.json
          retention-days: 30
