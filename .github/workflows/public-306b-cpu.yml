name: Replay the public PHerc. 306B CPU control
on:
  push:
    branches: [codex/public-306b-cpu-replay]
    paths:
      - '.github/workflows/public-306b-cpu.yml'
      - 'public-controls/pherc0306b-replay.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          python -m pip install numpy==1.26.4 zarr==2.18.7 safetensors==0.6.2 huggingface_hub==0.35.3 opencv-python-headless==4.11.0.86 tifffile==2025.6.11 scipy==1.15.3
      - name: Replay the three released finalist checkpoints
        run: python public-controls/pherc0306b-replay.py --output "$RUNNER_TEMP/public-306b-results"
      - uses: actions/upload-artifact@v4
        with:
          name: public-306b-smoke-results
          path: ${{ runner.temp }}/public-306b-results/*.json
          if-no-files-found: error
