name: Adaptive 069 wide anchor trust region
on:
  push:
    branches: [chatgpt/adaptive-surface-recovery]
    paths:
      - .github/workflows/chatgpt-adaptive-wide-anchor-trust.yml
permissions:
  contents: read
jobs:
  hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin solver and reader dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.12.0 dtw-python==1.5.3 scikit-learn==1.5.2 scikit-image==0.24.0 bioimage-cpp==0.8.0 pynrrd==1.1.3 tifffile==2024.9.20 numcodecs==0.15.1 Pillow==11.3.0 requests==2.32.5
      - name: Retrieve pinned Gemini reader
        run: |
          mkdir -p /tmp/adaptive-gemini
          git fetch --no-tags --depth=1 origin 74c55996176970025a41992bce22bdf893289910
          git show FETCH_HEAD:gemini_lane/stream_snap_render.py > /tmp/adaptive-gemini/stream_snap_render.py
          git show FETCH_HEAD:gemini_lane/grow_m7_patch.py > /tmp/adaptive-gemini/grow_m7_patch.py
          test "$(git hash-object /tmp/adaptive-gemini/stream_snap_render.py)" = 042fee4984205615b39d669c6f01500ecdff74a3
          test "$(git hash-object /tmp/adaptive-gemini/grow_m7_patch.py)" = 51c549f55437f57103a7e3f62483e194e3750125
          git show FETCH_HEAD:gemini_lane/seismic_rgt_unwrapper.py > /tmp/adaptive-gemini/seismic_rgt_unwrapper.py
          test "$(git hash-object /tmp/adaptive-gemini/seismic_rgt_unwrapper.py)" = 8162ac5dce8a1d50b02a91cb3f5881170a8d187e
      - name: Retrieve exact Claude 026 geometries
        run: |
          git init /tmp/claude-069
          git -C /tmp/claude-069 remote add origin https://github.com/JorisViaudQuantAI/Scrollprize.git
          git -C /tmp/claude-069 config remote.origin.promisor true
          git -C /tmp/claude-069 config remote.origin.partialclonefilter blob:none
          git -C /tmp/claude-069 fetch --no-tags --depth=1 --filter=blob:none origin ab5b297de8cf696e098852ccb9b3be766317acb2
          git -C /tmp/claude-069 sparse-checkout set firstletters-colab/pherc0211_fit_windings
          git -C /tmp/claude-069 checkout --detach FETCH_HEAD
      - name: Run frozen wider sparse-anchor trust-region comparison
        run: python firstletters-colab/adaptive_surface_recovery/wide_anchor_trust/run.py --claude /tmp/claude-069 --gemini /tmp/adaptive-gemini --output /tmp/trust-069.json --maps /tmp/trust-069.npz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-069-wide-anchor-trust-receipt
          path: |
            /tmp/trust-069.json
            /tmp/trust-069.npz
          retention-days: 30
