name: Adaptive 063 gap-aware cross-manuscript transfer
on:
  push:
    branches: [chatgpt/adaptive-surface-recovery]
    paths:
      - .github/workflows/chatgpt-adaptive-gap-aware-transfer.yml
permissions:
  contents: read
jobs:
  hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin solver and reader dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.12.0 dtw-python==1.5.3 scikit-learn==1.5.2 scikit-image==0.24.0 bioimage-cpp==0.8.0 pynrrd==1.1.3 tifffile==2024.9.20 numcodecs==0.15.1 Pillow==11.3.0 requests==2.32.5
      - name: Retrieve pinned Gemini reader
        run: |
          mkdir -p /tmp/adaptive-gemini
          git fetch --no-tags --depth=1 origin 0b92a3e06d686562f0f8bfb7baa264c3e98a9ca6
          git show FETCH_HEAD:gemini_lane/stream_snap_render.py > /tmp/adaptive-gemini/stream_snap_render.py
          git show FETCH_HEAD:gemini_lane/grow_m7_patch.py > /tmp/adaptive-gemini/grow_m7_patch.py
          test "$(git hash-object /tmp/adaptive-gemini/stream_snap_render.py)" = 042fee4984205615b39d669c6f01500ecdff74a3
          test "$(git hash-object /tmp/adaptive-gemini/grow_m7_patch.py)" = 51c549f55437f57103a7e3f62483e194e3750125
      - name: Run frozen predicted-gap-aware comparison
        run: python firstletters-colab/adaptive_surface_recovery/gap_aware_transfer/run.py --gemini /tmp/adaptive-gemini --prior firstletters-colab/adaptive_surface_recovery/dtw_cross_scroll/result.json --output /tmp/gap-aware-063.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-063-gap-aware-transfer-receipt
          path: /tmp/gap-aware-063.json
          retention-days: 30
