name: B22 native Reader distinct-parent transfer
on:
  push:
    branches: [chatgpt/b22-cross-parent-reader]
    paths:
      - '.github/workflows/chatgpt-b22-native-841.yml'
permissions:
  contents: read
jobs:
  native-841-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
          python -m pip install numpy==2.3.5 scipy==1.15.3 zarr==3.1.3 numcodecs==0.16.3 tifffile==2025.6.11 imagecodecs pillow pynrrd requests pyyaml fsspec s3fs cachetools edt aiohttp nest-asyncio timm==1.0.20 einops huggingface_hub dynamic-network-architectures fvcore batchgenerators scikit-image scikit-learn tqdm psutil
      - name: Acquire pinned sources and public Reader checkpoint
        shell: bash
        run: |
          set -euo pipefail
          for name in villa author; do git init "$RUNNER_TEMP/$name"; done
          git -C "$RUNNER_TEMP/villa" remote add origin https://github.com/ScrollPrize/villa.git
          git -C "$RUNNER_TEMP/villa" fetch --depth=1 origin b29f310957c7b29e7d332f9876e0e487819cfaa3
          git -C "$RUNNER_TEMP/villa" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/author" remote add origin https://github.com/priyankaranke/vesuvius-studio-multiscroll-cpt.git
          git -C "$RUNNER_TEMP/author" fetch --depth=1 origin bf66f753176792a966bca17822629fb8821f20c8
          git -C "$RUNNER_TEMP/author" checkout --detach FETCH_HEAD
          PYTHONPATH="$PWD/evidence" python -c 'from pathlib import Path; from fetch_fixture import fetch; import os; fetch("https://huggingface.co/domenicor046/reader-v3/resolve/aee1d64bced4eb35546348f3d276b9e2a0b99c46/reader-v3.pth","ea405417450abd8ace1b8ff79ebce3adb646c5e48ab95da46844d77efe984d8a",Path(os.environ["RUNNER_TEMP"])/"reader-v3.pth")'
      - name: Verify exact native 841 render and execute frozen Reader panel
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/villa/vesuvius/src:$PWD/evidence"
          python firstletters-colab/reader_cpu_optimization/b22_cross_parent/native_841.py "$RUNNER_TEMP/841-cache" "$RUNNER_TEMP/author" "$RUNNER_TEMP/reader-v3.pth" "$RUNNER_TEMP/b22-out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b22-native-841-receipt
          path: ${{ runner.temp }}/b22-out/
          retention-days: 14
          if-no-files-found: warn
