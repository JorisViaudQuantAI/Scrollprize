name: 65 native planes along the complete public winding
on:
  push:
    branches: [codex/pherc0125-atlas-centres]
    paths: [.github/workflows/pherc0125-native-winding65.yml]
permissions: {}
jobs:
  public-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve public winding geometry code
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/codex/pherc0125-atlas-centres"
          for file in atlas125.py stage125.py full_atlas125.py atlas_65_entier.py recipient.pem; do
            curl --silent --show-error --location --fail --retry 3 --max-time 50 "$base/$file" --output "$file"
          done
          python -m pip --quiet install 'numpy<2.4' 'scipy<1.18' requests tifffile 'zarr==2.18.7' 'numcodecs==0.15.1'
      - name: Render the complete public atlas uniformly at 65 native depths
        run: python -u atlas_65_entier.py recipient.pem
      - name: Return encrypted public native tile r00c00
        uses: actions/upload-artifact@v4
        with:
          name: whole-w045-native65-r00c00
          path: delivery/r00c00/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Return encrypted public native tile r00c01
        uses: actions/upload-artifact@v4
        with:
          name: whole-w045-native65-r00c01
          path: delivery/r00c01/
