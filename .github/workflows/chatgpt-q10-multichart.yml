name: Q10 public multi-chart material atlas
on:
  push:
    branches: [chatgpt/adaptive-surface-recovery]
    paths:
      - .github/workflows/chatgpt-q10-multichart.yml
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'scipy==1.12.0' 'pillow==11.3.0' 'shapely==2.0.6'
      - name: Geometry unit tests
        run: python firstletters-colab/adaptive_surface_recovery/multichart_atlas/run.py --self-test
      - name: Execute frozen atlas experiment
        run: python firstletters-colab/adaptive_surface_recovery/multichart_atlas/run.py --cache /tmp/q10-atlas-source --output /tmp/q10-atlas.json --atlas /tmp/q10-atlas
      - uses: actions/upload-artifact@v4
        with:
          name: q10-multichart-public-receipt
          path: |
            /tmp/q10-atlas.json
            /tmp/q10-atlas
          retention-days: 30
