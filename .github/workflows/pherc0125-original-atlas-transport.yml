name: Encrypted original public anatomical atlas
on:
  push:
    branches: [codex/pherc0125-original-atlas-transport]
    paths: [.github/workflows/pherc0125-original-atlas-transport.yml]
permissions: {}
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the published geometry and public CT code at the branch commit
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/codex/pherc0125-atlas-centres"
          for file in atlas125.py stage125.py full_atlas125.py recipient.pem transport_public.py; do
            curl --silent --show-error --fail --location --retry 3 --max-time 45 "$base/$file" --output "$file"
          done
          python -m venv .venv
          .venv/bin/pip --quiet install 'numpy<2.4' 'scipy<1.18' requests tifffile
      - name: Render the complete original public comparison winding
        run: .venv/bin/python -u transport_public.py z11136_w035
      - name: Return encrypted band-00
        uses: actions/upload-artifact@v4
        with:
          name: public-original-0125-w035-band-00
          path: delivery/band-00/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Return encrypted band-01
        uses: actions/upload-artifact@v4
        with:
          name: public-original-0125-w035-band-01
          path: delivery/band-01/
          if-no-files-found: error
