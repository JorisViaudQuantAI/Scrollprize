name: Adaptive 050 public winner geometry
on:
  push:
    branches: [chatgpt/adaptive-surface-recovery]
    paths:
      - .github/workflows/chatgpt-adaptive-winner-geometry.yml
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy==1.26.4 scipy==1.12.0 shapely==2.0.6 tifffile==2024.9.20 Pillow==11.3.0 requests==2.32.5
      - name: Execute frozen winner geometry and depth tube reference
        run: python firstletters-colab/adaptive_surface_recovery/winner_geometry/run.py --cache /tmp/winner-050 --output /tmp/winner-050.json
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-050-winner-geometry-receipt
          path: /tmp/winner-050.json
          retention-days: 30
