name: Adaptive 053 annotated instance separation
on:
  push:
    branches: [chatgpt/adaptive-surface-recovery]
    paths:
      - .github/workflows/chatgpt-adaptive-orthogonal-instances.yml
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin CPU dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.12.0 scikit-learn==1.5.2 scikit-image==0.24.0 bioimage-cpp==0.8.0 pynrrd==1.1.3 tifffile==2024.9.20 Pillow==11.3.0 requests==2.32.5 zarr==2.18.7 numcodecs==0.15.1
      - name: Verify upstream reference implementation
        run: |
          git init /tmp/sheet-tools-053
          git -C /tmp/sheet-tools-053 fetch --no-tags --depth=1 https://github.com/IyanDopico/vesuvius-sheet-tools.git cc1fb1429d62670f7dc00943932e90d0e6d31c8a
          git -C /tmp/sheet-tools-053 checkout --detach FETCH_HEAD
          test "$(git hash-object /tmp/sheet-tools-053/scripts/split_patch.py)" = aca2775967d3ca18ee821a9f63f8ca163cdd1e66
          test "$(git hash-object /tmp/sheet-tools-053/scripts/split_stacked.py)" = 2878161597aa56a814a9663ed22888ba48f1e8e0
          test "$(git hash-object /tmp/sheet-tools-053/scripts/separate_sheets.py)" = a5d35496542a63160aa818f98957f09bd917b561
      - name: Run preregistered control comparison
        run: python firstletters-colab/adaptive_surface_recovery/orthogonal_instances/run.py --external /tmp/sheet-tools-053/scripts --cache /tmp/orthogonal-053 --output /tmp/orthogonal-053.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-053-instance-receipt
          path: /tmp/orthogonal-053.json
          retention-days: 30
