name: Receive complete public TIFF planes
on:
  push:
    branches: [codex/legacy-source-planes-full]
    paths: [.github/workflows/legacy-source-planes-full.yml]
permissions: {}
jobs:
  receive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open image readers
        run: python -m pip --quiet install numpy tifffile Pillow
