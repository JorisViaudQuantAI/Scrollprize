          UfUrIAjwPRWZf8s=
          -----END CERTIFICATE-----
          CERTIFICATE
          cat > collect.py <<'PY'
          """Transport complete public scalar TIFF planes in 8-bit form, encrypted for one recipient."""
          from concurrent.futures import ThreadPoolExecutor
          from hashlib import file_digest, sha256
          from pathlib import Path
          from urllib.request import urlopen
          import json
          import shutil
          import subprocess
          import time
          
          import numpy as np
          from PIL import Image
          import tifffile
          
          SEGMENT = '20230510153006'
          BASE = f'https://dl.ash2txt.org/full-scrolls/Scroll1/PHercParis4.volpkg/paths/{SEGMENT}/layers/'
          
          def digest(p):
              with p.open('rb') as f:
                  return file_digest(f,'sha256').hexdigest()
          
          def transport(layer):
              tag=f'{layer:02d}';source=BASE+tag+'.tif';original=Path(f'original-{tag}.tif')
              for k in range(4):
                  try:
                      with urlopen(source,timeout=65) as reply, original.open('wb') as dst:
                          shutil.copyfileobj(reply,dst,length=2**20)
                          if original.stat().st_size!=65777885:
                              raise OSError('Unexpected full public TIFF byte count')
                      break
                  except OSError:
                      if k==3:raise
                      time.sleep(2**k)
              a=tifffile.memmap(original)
              if a.shape!=(9533,3450) or a.dtype!=np.uint16:raise ValueError('Unexpected full plane shape or type')
              pixels=np.empty(a.shape,dtype=np.uint8)
              for y in range(0,a.shape[0],128):pixels[y:y+128]=((a[y:y+128].astype('u4')+128)//257).astype('u1')
              out=Path('ready')/tag;out.mkdir(parents=True,exist_ok=True);image=Path('plane-'+tag+'.png');Image.fromarray(pixels).save(image,compress_level=4)
              encrypted=out/'plane.cms'
              subprocess.run(['openssl','cms','-encrypt','-binary','-outform','DER','-aes-256-gcm','-in',str(image),'-out',str(encrypted),'recipient.pem'],check=True)
              receipt={'source':source,'original_sha256':digest(original),'original_bytes':original.stat().st_size,'shape_yx':list(a.shape),'raw_uint8_sha256':sha256(pixels).hexdigest(),'encoded_png_sha256':digest(image),'encrypted_sha256':digest(encrypted),'encrypted_bytes':encrypted.stat().st_size,'representation':'all native pixels, round(uint16/257), lossless PNG, no region or mask'}
              (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');print(tag,receipt['encrypted_bytes'],flush=True)
              del a,pixels;original.unlink();image.unlink()
          
          if __name__=='__main__':
              with ThreadPoolExecutor(max_workers=2) as pool:list(pool.map(transport,range(22,43)))
          PY
          python collect.py
