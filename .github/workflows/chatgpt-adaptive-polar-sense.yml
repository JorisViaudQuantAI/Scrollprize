name: Adaptive 044 polar winding sense
on:
  push:
    branches: [chatgpt/adaptive-surface-recovery]
    paths:
      - .github/workflows/chatgpt-adaptive-polar-sense.yml
permissions:
  contents: read
jobs:
  polar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy==1.26.4 scipy==1.12.0 requests==2.32.5
      - name: Acquire public official axis file
        run: |
          curl --fail --silent --show-error --max-time 20 https://raw.githubusercontent.com/AlexeyDrobkovStrikesBack/herculaneum-umbilici/main/PHerc1203_umbilicus.json -o /tmp/official1203.json
          test "$(git hash-object /tmp/official1203.json)" = 2496c8ebf6dcd8d8d56e71cabc86360916d19c7f
      - name: Frozen synthetic and real transverse-slice test
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: python firstletters-colab/adaptive_surface_recovery/polar_sense/run.py --official-center /tmp/official1203.json --output /tmp/polar-044.json
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-044-polar-sense-receipt
          path: /tmp/polar-044.json
          retention-days: 30
