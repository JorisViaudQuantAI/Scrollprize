name: Industrial funnel RFC reference checks
on:
  push:
    branches: [chatgpt/industrial-search-funnel-rfc]
    paths:
      - .github/workflows/chatgpt-industrial-funnel-rfc.yml
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test reference contracts with synthetic fixtures only
        run: python firstletters-colab/industrial_funnel/verify.py --output /tmp/industrial-funnel-rfc-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: industrial-funnel-rfc-synthetic-receipt
          path: /tmp/industrial-funnel-rfc-receipt.json
          retention-days: 30
