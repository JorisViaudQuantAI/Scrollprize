name: Public PHerc. 841 tile blending comparison
on:
  push:
    branches: [codex/r50-hann-public]
    paths:
      - 'public-controls/r50_stack.py'
      - 'public-controls/hann_panel.py'
      - 'public-controls/test_hann.py'
      - '.github/workflows/r50-hann-public.yml'
permissions:
  contents: read
jobs:
  two-fields:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install CPU inference dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/panel-env"
          "$RUNNER_TEMP/panel-env/bin/python" -m pip install -q --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          "$RUNNER_TEMP/panel-env/bin/python" -m pip install -q --disable-pip-version-check 'transformers==4.57.6' 'safetensors==0.6.2' 'numpy==2.2.6' 'scipy==1.15.3' 'zarr==3.1.3' 'fsspec==2025.9.0' 'aiohttp>=3.10,<4' 'requests>=2.32,<3'
      - name: Verify reassembly, boundaries and the command line
        run: '"$RUNNER_TEMP/panel-env/bin/python" public-controls/test_hann.py'
      - name: Freeze the label-only fields and compare both tile grids
        run: '"$RUNNER_TEMP/panel-env/bin/python" public-controls/hann_panel.py --cache "$RUNNER_TEMP/r50-weights" --output "$RUNNER_TEMP/r50-hann.json"'
      - uses: actions/upload-artifact@v4
        with:
          name: public-841-hann-metrics
          path: ${{ runner.temp }}/r50-hann.json
          retention-days: 14
