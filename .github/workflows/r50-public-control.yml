name: Score one published PHerc. 841 control tile
on:
  push:
    branches: [codex/r50-public-control]
    paths:
      - .github/workflows/r50-public-control.yml
      - public-controls/r50_tile.py
permissions: {}
jobs:
  cpu-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Read the public script at the triggering commit
        run: |
          git init study
          git -C study fetch --depth=1 https://github.com/JorisViaudQuantAI/Scrollprize.git "$GITHUB_SHA"
          git -C study checkout --detach FETCH_HEAD
          test "$(git -C study rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install the CPU runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/r50-venv"
          "$RUNNER_TEMP/r50-venv/bin/python" -m pip install -q --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          "$RUNNER_TEMP/r50-venv/bin/python" -m pip install -q --disable-pip-version-check 'transformers==4.57.6' 'safetensors==0.6.2' 'numpy==2.2.6' 'zarr==3.1.3' 'fsspec==2025.9.0' 'aiohttp>=3.10,<4' 'requests>=2.32,<3'
      - name: Run one CPU tile and report labelled ink and background
        working-directory: study
        run: |
          "$RUNNER_TEMP/r50-venv/bin/python" public-controls/r50_tile.py --cache "$RUNNER_TEMP/r50-weights"
